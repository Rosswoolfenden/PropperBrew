app = "propperbrew-api"
primary_region = "lhr" # London, UK
kill_signal = "SIGTERM"
kill_timeout = "30s" # let in-flight webhook enrichment finish; anything unfinished is retried by the sweeper

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SHOPIFY_API_VERSION = "2026-04"
  PUBLIC_API_URL = "https://api.yourcoffeeapp.co.uk"

# Secrets (fly secrets set ...): DATABASE_URL, TOKEN_ENCRYPTION_KEY, SUPABASE_URL,
# SHOPIFY_API_KEY, SHOPIFY_API_SECRET, SHOPIFY_SCOPES, ANTHROPIC_API_KEY

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off" # Keep warm: Shopify webhooks time out after 5s, and the sweeper/notification jobs run in-process
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
