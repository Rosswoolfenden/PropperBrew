# Staging API. Deploy from the repo root:  fly deploy --config apps/api/fly.staging.toml .
# Uses Fly's own address, so staging needs no domain. See SETUP.md, "Staging".
app = "propperbrew-api-staging"
primary_region = "lhr" # London, UK
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  SHOPIFY_API_VERSION = "2026-04"
  SHOPIFY_SCOPES = "read_products,read_inventory,read_locations,write_orders,read_orders,read_fulfillments,read_shipping"
  PUBLIC_API_URL = "https://propperbrew-api-staging.fly.dev"
  PUBLIC_WEB_URL = "https://propperbrew-web-staging.fly.dev"
  UPLOADS_DRIVER = "supabase"

# Secrets (fly secrets set --app propperbrew-api-staging ...): DATABASE_URL, TOKEN_ENCRYPTION_KEY,
# SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SHOPIFY_API_KEY, SHOPIFY_API_SECRET, and optionally
# ANTHROPIC_API_KEY, STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET (test mode).

[http_service]
  internal_port = 8080
  force_https = true
  # Kept awake like production: Shopify webhooks time out after 5s, and the jobs run in-process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
