packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@anthropic-ai/sdk@0.134.0"
  - "@expo/cli@57.0.30"
  - "@expo/prebuild-config@57.0.19"
  - expo-asset@57.0.20
  - expo-constants@57.0.22
  - expo-modules-autolinking@57.0.16
  - expo-modules-core@57.0.23
  - expo@57.0.29
  - "@expo/metro-runtime@57.0.17"
  - "@expo/ui@57.0.24"
  - expo-linking@57.0.13
  - expo-notifications@57.0.23
  - expo-router@57.0.27
# Security fixes in transitive dependencies (Expo's CLI pins an older node-forge).
overrides:
  node-forge: ">=1.4.3"
