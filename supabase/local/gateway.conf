# Local stand-in for Supabase's API gateway: serves the auth service at /auth/v1 (the path
# supabase-js uses) and adds the CORS headers the gateway normally adds, so browsers can call it.
server {
  listen 80;

  location /auth/v1/ {
    # The auth service answers preflights without CORS headers; answer them here instead.
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin $http_origin always;
      add_header Access-Control-Allow-Credentials true always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version" always;
      add_header Access-Control-Max-Age 3600 always;
      return 204;
    }

    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials true always;
  }

  # Sign-in links: the auth service builds them as <host>/verify, without the /auth/v1 prefix.
  location = /verify {
    proxy_pass http://auth:9999/verify;
    proxy_set_header Host $host;
  }

  # Email templates the auth service fetches (supabase/templates). Inside the compose network only
  # in practice, but nothing in them is secret.
  location /templates/ {
    alias /templates/;
  }

  location / {
    return 404;
  }
}
