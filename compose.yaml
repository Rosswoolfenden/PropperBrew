# Local preview of the whole stack with sample data and no real keys:  docker compose up --build
# Website http://localhost:3000, app (web build) http://localhost:8081, API http://localhost:4000,
# auth (Supabase-compatible) http://127.0.0.1:54321, email inbox http://localhost:54324. Sample sign-ins (password "password123"):
# alice@example.com (coffee drinker) and roaster@north-star.test (business, runs North Star).
# Shopify sync and the bag scanner need real credentials and won't work here.
# `docker compose down -v` throws the data away; the next `up` reseeds it.

name: propperbrew

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      AUTH_DB_PASSWORD: auth
    volumes:
      - ./e2e/db:/fixtures:ro
      - ./e2e/db/docker-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - ${DB_PORT:-54322}:5432
    healthcheck:
      # Only listens on TCP once the init script has finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      retries: 30

  # Supabase's auth service. Creates and owns the auth.* tables.
  auth:
    image: supabase/gotrue:v2.197.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:${SUPABASE_PORT:-54321}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:auth@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:${WEB_PORT:-3000}
      # Where sign-in links may send people back to (any local port, and the app's schemes).
      GOTRUE_URI_ALLOW_LIST: http://localhost:*/**,http://127.0.0.1:*/**,propperbrew://**,exp://**
      # Placeholder for local use. The auth service signs sessions with it; the API checks them with it.
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      # New accounts confirm their email first, as in production. Mail goes to Mailpit
      # (http://localhost:54324), which catches everything and sends nothing.
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      GOTRUE_SMTP_ADMIN_EMAIL: hello@propperbrew.local
      GOTRUE_SMTP_SENDER_NAME: PropperBrew
      # Changing email needs only the new address confirmed.
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "false"
      # Our emails (supabase/templates), served by the gateway.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway/templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://gateway/templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://gateway/templates/email-change.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://gateway/templates/magic-link.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirm your PropperBrew account
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Reset your PropperBrew password
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: Confirm your new email address
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your PropperBrew sign-in link
      # Generous limits locally (the tests send a lot of mail); production keeps Supabase's defaults.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "1000"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "10000"
      GOTRUE_RATE_LIMIT_VERIFY: "10000"
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 2s
      retries: 30

  # Catches the auth service's email. Web inbox and API at http://localhost:54324.
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - ${MAIL_PORT:-54324}:8025

  # Applies supabase/migrations and the seed once auth.* exists, then exits.
  migrate:
    image: pgvector/pgvector:pg17
    command: ["sh", "/fixtures/migrate.sh"]
    environment:
      POSTGRES_PASSWORD: postgres
      # Where the seeded coffee photos are served from (the API's /mock/*).
      IMAGE_BASE_URL: http://localhost:${API_PORT:-4000}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./e2e/db:/fixtures:ro
    depends_on:
      auth:
        condition: service_healthy

  # Serves the auth service at /auth/v1, like Supabase's gateway, so clients use the usual URL.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./supabase/local/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./supabase/templates:/templates:ro
    ports:
      - ${SUPABASE_PORT:-54321}:80
    depends_on:
      auth:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "4000"
      PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
      PUBLIC_WEB_URL: http://localhost:${WEB_PORT:-3000}
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      TOKEN_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      # Inside the compose network, the gateway is http://gateway.
      SUPABASE_URL: http://gateway
      SUPABASE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      SHOPIFY_API_KEY: placeholder
      SHOPIFY_API_SECRET: placeholder
      SHOPIFY_SCOPES: read_products
      # In-app checkout is off unless you pass Stripe test keys (see README, "In-app checkout").
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Uploaded photos, kept in a volume so they survive rebuilds.
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - ${API_PORT:-4000}:4000
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Server-side rendering talks to the API over the compose network...
      API_URL: http://api:4000
      # ...while the browser uses the host's ports.
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:${SUPABASE_PORT:-54321}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-anon-key
    ports:
      - ${WEB_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy

  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile.web
      args:
        # Called from your browser, so these are the host's addresses.
        EXPO_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
        EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:${SUPABASE_PORT:-54321}
        # Email links from the app (confirm, reset password) open the website.
        EXPO_PUBLIC_WEB_URL: http://localhost:${WEB_PORT:-3000}
    ports:
      - ${MOBILE_PORT:-8081}:80
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploads:
